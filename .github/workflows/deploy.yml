name: Deploy GitHub Pages redirect

# The canonical site now lives at https://sakha.wtf (deployed on Railway).
# GitHub Pages only serves a redirect to it, so old alirezasakhaei.github.io links keep working.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect site
        run: |
          mkdir -p _site
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Redirecting to sakha.wtf</title>
              <link rel="canonical" href="https://sakha.wtf/" />
              <meta http-equiv="refresh" content="0; url=https://sakha.wtf/" />
              <script>
                window.location.replace("https://sakha.wtf/" + window.location.hash);
              </script>
              <style>
                body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; }
                a { color: #2563eb; }
              </style>
            </head>
            <body>
              <p>This site has moved to <a href="https://sakha.wtf/">sakha.wtf</a>. Redirecting…</p>
            </body>
          </html>
          HTML
          cp _site/index.html _site/404.html
          touch _site/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
